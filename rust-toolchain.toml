# Pinned to match `../er-mods-rs`, which must be at least as strict as `../fromsoftware-rs`.
#
# `channel = "stable"` pins the CHANNEL, not the version. rustup will not update an already
# installed stable on its own, so a local toolchain can sit months behind CI's and every lint
# gate here will agree with itself while disagreeing with CI. Run `rustup update stable`
# before believing a clean sweep.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc"]
