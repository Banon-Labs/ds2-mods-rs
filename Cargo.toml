# DS2 mods workspace.
#
# MEMBERS ARE A GLOB ON PURPOSE. This repo is built by parallel agents in separate git
# worktrees, each adding one crate. An explicit member list turns every one of those into a
# conflict on the same three lines of this file; a glob means a branch that adds
# `crates/<name>/` touches nothing another branch touches. Cargo resolves the glob at
# metadata time, so a new crate needs no edit here at all.
[workspace]
members = ["crates/*"]
# A path dependency under the workspace root is a member unless excluded. The vendored hudhook is
# Windows-only upstream code under its own lints, and a host `cargo test --workspace` cannot build
# it.
exclude = ["vendor/hudhook"]
resolver = "2"

# LINT PARITY WITH `../er-mods-rs`, which is itself at parity with `../fromsoftware-rs`:
# stock lint set, denied. `priority = -1` makes these groups apply BEFORE any single-lint
# entry, so a crate can allow one specific lint in its own `[lints]` table without
# abandoning the deny. Every such allow must carry a `# DEBT:` comment.
#
# DO NOT add a blanket `-Awarnings` to `.cargo/config.toml`. It defeats
# `rust.warnings = "deny"` outright (same lint group, applied later) while leaving
# `clippy.all = "deny"` standing -- so half the gate switches off with no diagnostic saying
# so. That cost er-mods-rs months of false-green lint runs; see its root Cargo.toml.
[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
# A public item with no doc comment. `docs/COMMENTS.md` is the convention; this is the part of
# it a compiler can hold.
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# THE DOC LINTS THE STOCK SET LEAVES OFF. Every one of these lives in `clippy::pedantic` or
# `clippy::restriction`, neither of which `all` includes, so denying `all` above switched on
# none of them. They are named one by one rather than by taking all of pedantic: each is a rule
# `docs/COMMENTS.md` states in prose, and this is the same rule stated where it bites.
undocumented_unsafe_blocks = "deny"
missing_panics_doc = "deny"
missing_errors_doc = "deny"
too_long_first_doc_paragraph = "deny"
doc_markdown = "deny"

# `docs/COMMENTS.md` says an address is named by its `ds2_rva` constant, as an intra-doc link,
# because a link to a deleted entry fails and a bare `0x140513600` does not. This is the lint
# that makes the failure happen -- and it only runs under `cargo doc`, which is why
# `scripts/check.sh` now has a docs step.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/Banon-Labs/ds2-mods-rs"

[workspace.dependencies]
# Substrate crates reference each other through these so a version bump is one edit.
ds2-game-base = { path = "crates/ds2-game-base" }
ds2-hook = { path = "crates/ds2-hook" }
# The address table. Only crates that genuinely claim to know something about DARK SOULS II may
# depend on this -- `ds2-game-base` deliberately does not, and must not start.
ds2-rva = { path = "crates/ds2-rva" }
# Typed layouts over the objects at those addresses. Depends on `ds2-rva`, never re-exports it.
darksouls2 = { path = "crates/darksouls2" }
ds2-hotkey-config = { path = "crates/ds2-hotkey-config" }
ds2-safe-input = { path = "crates/ds2-safe-input" }
ds2-crash-logging-core = { path = "crates/ds2-crash-logging-core" }
ds2-dialog-skip = { path = "crates/ds2-dialog-skip" }
ds2-intro-skip = { path = "crates/ds2-intro-skip" }
ds2-boot-timeline = { path = "crates/ds2-boot-timeline" }
ds2-continue = { path = "crates/ds2-continue" }
ds2-offline = { path = "crates/ds2-offline" }
ds2-save-redirect = { path = "crates/ds2-save-redirect" }
ds2-build-import = { path = "crates/ds2-build-import" }
ds2-build-import-core = { path = "crates/ds2-build-import-core" }
# The PvP build recommender panel: its model and backend contract (host-tested), and the panel.
ds2-build-recommender-core = { path = "crates/ds2-build-recommender-core" }
ds2-build-recommender-ui = { path = "crates/ds2-build-recommender-ui" }
# The Load from URL field's lifecycle: submit, cancel, re-open, clipboard gate. Host-only.
ds2-build-url-core = { path = "crates/ds2-build-url-core" }
ds2-menu-row = { path = "crates/ds2-menu-row" }
# The one `Present` detour: the per-frame clock, the drawer table and every imgui panel.
ds2-overlay = { path = "crates/ds2-overlay" }
ds2-inventory-sort = { path = "crates/ds2-inventory-sort" }
ds2-voice-chat = { path = "crates/ds2-voice-chat" }
# A key that applies a SpEffect to the local player, the way the game applies its own.
ds2-net-effects = { path = "crates/ds2-net-effects" }
ds2-item-warn = { path = "crates/ds2-item-warn" }
ds2-invasion-path = { path = "crates/ds2-invasion-path" }
# The floating HP bar and damage number over other characters, resized and centred.
ds2-hp-gauge = { path = "crates/ds2-hp-gauge" }
# Agent-driven input: writes the device state the engine reads, and blanks the human's.
ds2-input-harness = { path = "crates/ds2-input-harness" }
ds2-sl2-core = { path = "crates/ds2-sl2-core" }
# The save picker's rows and decisions, host-tested. Drawn by `ds2-save-file`'s in-game panel.
ds2-save-picker-core = { path = "crates/ds2-save-picker-core" }
ds2-save-file = { path = "crates/ds2-save-file" }
ds2-save-file-core = { path = "crates/ds2-save-file-core" }
# Refuses the game's own saves, so the rows above are the only thing that writes the container.
ds2-save-block = { path = "crates/ds2-save-block" }
# The second mod's configuration, read rather than shipped. See the crate docs.
ds2-seamless = { path = "crates/ds2-seamless" }
# Logs, per character load, whether soul memory could have paid for the soul level.
ds2-soul-memory-guard = { path = "crates/ds2-soul-memory-guard" }
# Caps our weapon levels to the other players' while anyone else is in the world.
ds2-weapon-sync = { path = "crates/ds2-weapon-sync" }
# The one net session update detour that voice chat and weapon sync share.
ds2-net-tick = { path = "crates/ds2-net-tick" }
ds2-estus-max = { path = "crates/ds2-estus-max" }
ds2-change-appearance = { path = "crates/ds2-change-appearance" }
# Logs the music events the game starts and stops, through the FMOD import slots.
ds2-music-probe = { path = "crates/ds2-music-probe" }

# Arxan neutering. DS2 SOTFS carries 48 Arxan stubs; every MinHook detour patches a prologue
# in `.text`, which is what their integrity checks look for. Path dep on the local checkout
# rather than crates.io so a fix lands without a release.
dearxan = { path = "../dearxan", default-features = false }
# Pure-Rust zlib inflate, for reading the game's own effect bundle (`ds2-invasion-path`
# derives its sparkle-free Prism Stone from `sfx9999.ffxbnd.dcx` at runtime).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# The in-game SpEffect selector's overlay: Dear ImGui on the game's own swap chain. Vendored
# 0.9.2 with a shared-`Present` entry point and no MinHook copy of its own; the reasons are at the
# top of `vendor/hudhook/Cargo.toml`.
hudhook = { path = "vendor/hudhook", default-features = false, features = ["dx11"] }
# `ds2-net-effects` reads its SpEffect catalog, which is in er-net-effects' master-catalog JSON
# shape. Host-buildable, so the reader is covered by `cargo test`.
serde_json = "1"
