[package]
name = "ds2-weapon-sync"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The policy module is arithmetic over levels and pointers-as-numbers and builds everywhere, so its
# tests run on the machine the code is written on. Only the detours need Windows.
[dependencies]
ds2-rva.workspace = true

[target.'cfg(windows)'.dependencies]
ds2-game-base.workspace = true
ds2-hook.workspace = true
ds2-hotkey-config.workspace = true
ds2-net-tick.workspace = true
# The on/off swords are one of `ds2-overlay`'s imgui panels, drawn through its `Present` detour on
# the game's own swap chain; `hudhook` is for the `imgui::Ui` that panel is handed.
ds2-overlay.workspace = true
hudhook.workspace = true

[lints]
workspace = true
