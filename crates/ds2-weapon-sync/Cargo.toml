[package]
name = "ds2-weapon-sync"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The policy module is arithmetic over levels and pointers-as-numbers and builds everywhere, so its
# tests run on the machine the code is written on. Only the detours need Windows.
[dependencies]
ds2-rva.workspace = true
# The status strip's tile geometry and the palette are host code, so the glyph tests use them too.
ds2-overlay.workspace = true

[target.'cfg(windows)'.dependencies]
ds2-game-base.workspace = true
ds2-hook.workspace = true
ds2-hotkey-config.workspace = true
ds2-net-tick.workspace = true
# The on/off swords are one of `ds2-overlay`'s imgui panels (dependency above), drawn through its
# `Present` detour; `hudhook` is for the `imgui::Ui` that panel is handed.
hudhook.workspace = true

[lints]
workspace = true
