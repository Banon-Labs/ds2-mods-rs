# THE FIRST LOADABLE DLL IN THIS WORKSPACE. Everything else in `crates/` is an rlib.
#
# See `docs/LOADING.md` for the import-surface survey this crate is the conclusion of: me3
# cannot launch DARK SOULS II, so a mod gets in by proxying one of `DarkSoulsII.exe`'s own
# imports, and `DINPUT8.dll` is the smallest honest one (a single named export,
# `DirectInput8Create`).
[package]
name = "ds2-loader"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# THE OUTPUT FILE NAME IS THE PRODUCT. `name = "dinput8"` is what makes cargo emit
# `dinput8.dll`, which is the name the Windows loader looks for when resolving
# `DarkSoulsII.exe`'s `DINPUT8.dll` import descriptor. Renaming this unbinds the proxy and the
# DLL is simply never loaded -- there is no error, the game just runs vanilla.
name = "dinput8"
crate-type = ["cdylib"]

# EVERY DEPENDENCY IS TARGET-GATED, and so is the whole of `src/lib.rs`.
#
# `dearxan`'s `disabler` feature pulls `windows-sys` (see `docs/LOADING.md`), so it builds only
# for the Windows target. Gating the entire dependency set rather than just that one keeps the
# rule simple: a host build of this crate produces an empty cdylib instead of a link error, so
# `scripts/check.sh --host-tests` stays runnable for the crates that are host-testable.
#
# `default-features = false` comes from the workspace entry, so both features are named
# explicitly. `rayon` was OFF here for exactly as long as its cost was unmeasured, with a note
# saying to turn it on if a real run showed the analysis was slow and not to turn it on on a
# guess. A real run showed it: `ds2-boot-timeline` brackets `neuter_arxan` with milestones and
# measured it at 284.9ms, 4.2% of a 6.8s boot, single-threaded. That is the condition the note
# set, so it is on -- and the two milestones stay in place so the next person can see whether it
# is still earning its dependency tree rather than taking this comment's word for it.
#
# `ds2-hook` and `ds2-rva` arrived with the M1 Arxan probe (`src/arxan_probe.rs`) and are the
# reason this crate is no longer game-knowledge-free. `ds2-hook` brings the vendored MinHook C
# into the DLL -- statically, so this module owns its own MinHook instance, which is the design
# that crate documents. `ds2-rva` brings exactly one address: the function the probe detours.
# Both are dead weight in an ordinary run (the probe is off unless `<Game>/ds2-mods.toml` turns
# it on), and both come out again if the probe is ever removed rather than promoted.
#
# `ds2-hotkey-config` is here for its config machinery and NOT for its key names: `kv::KeyValues`
# reads `key = value` under `[section]` headers, and `reload::HotFile` notices a file changed by
# comparing its TEXT rather than its mtime -- which is what a Proton prefix's one-second mtime
# resolution requires. It costs nothing: that crate has no dependencies at all, deliberately, so
# adding it does not add a TOML parser or anything else to this DLL.
# `ds2-crash-logging-core` is the crash logger, linked as a LIBRARY rather than loaded as the
# standalone `ds2_crash_logging.dll` that `crates/ds2-crash-logging` also builds. That DLL has no
# way into this process: `scripts/ds2-run.py` stages exactly one file, `dinput8.dll`, because that
# is the name `DarkSoulsII.exe` imports, and the only way to pull in a second one from here would
# be `LoadLibrary` under the loader lock -- the deadlock this crate refuses to commit elsewhere.
# The standalone DLL is a `DllMain` wrapper around the same `install` call; see `crash_logging`.
[target.'cfg(windows)'.dependencies]
ds2-crash-logging-core.workspace = true
ds2-game-base.workspace = true
ds2-hook.workspace = true
ds2-dialog-skip.workspace = true
ds2-intro-skip.workspace = true
ds2-boot-timeline.workspace = true
ds2-continue.workspace = true
ds2-offline.workspace = true
ds2-save-redirect.workspace = true
ds2-build-import.workspace = true
ds2-menu-row.workspace = true
ds2-hotkey-config.workspace = true
ds2-rva.workspace = true
dearxan = { workspace = true, features = ["disabler", "rayon"] }

[lints]
workspace = true
