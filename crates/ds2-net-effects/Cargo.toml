[package]
name = "ds2-net-effects"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Not target-gated: the key and effect settings, the edge detection and the request bytes are pure
# code in `lib.rs` that the host tests exercise. `ds2-hotkey-config` has no dependencies of its own,
# `ds2-rva` is constants, and `darksouls2`'s layouts build on the host.
[dependencies]
darksouls2.workspace = true
ds2-hotkey-config.workspace = true
ds2-rva.workspace = true
# The catalog reader (`catalog.rs`). The catalog is JSON in er-net-effects' master-catalog shape.
serde_json.workspace = true
# The status strip's tile geometry, which `glyph.rs` lays the sparkle out in; host code.
ds2-overlay.workspace = true

# The game-facing half. `ds2-overlay` (above) is also its `Present` clock and its panel table: the key
# is read and the effect applied from a consumer registered on the clock, which is the game thread,
# and the selector bar is one of its panels.
[target.'cfg(windows)'.dependencies]
ds2-game-base.workspace = true
ds2-hook.workspace = true
# The selector bar's `imgui::Ui`, through the one vendored copy `ds2-overlay` renders with.
hudhook.workspace = true

[lints]
workspace = true
