# DARK SOULS II mod settings. Put this file beside DarkSoulsII.exe and dinput8.dll.
# Every key is optional: a missing key means the built-in default, and every built-in default is
# the game as shipped. Keys marked (live) take effect about a second after you save the file.

# ============================================================================================
# Online and co-op
# ============================================================================================

[offline]
# On by default. These mods patch the game in memory, which FromSoftware's servers look for;
# this keeps you off them. Ignored while [seamless] is enabled.
enabled = true
pin_flag = true        # never leave the offline state the game boots in
report_offline = true  # every "am I online?" check answers no
block_sockets = true   # refuse non-loopback connections, incl. the server login the flags miss

[seamless]
# Seamless Co-op is someone else's mod: install and update it yourself. Set enabled = true once
# it is installed, then start the game with ds2-launcher.exe instead of Steam.
enabled = false
# Its DLL, relative to this folder.
dll = "SeamlessCoop/ds2sc.dll"
# Must match save_file_extension in its ds2sc_settings.ini (vanilla saves are sl2).
save_file_extension = "co2"

[launcher]
# Only read by ds2-launcher.exe, which you need only for Seamless or other DLLs that must be
# injected before the game starts. Starting through it costs Steam playtime, overlay and cloud saves.
# Extra DLLs, in load order; one missing file refuses the launch. Never list dinput8.dll.
dlls = []
exe = "DarkSoulsII.exe"

[voice_chat]
# A key that toggles Options > Game > Voice chat, kept only if the game saves afterwards.
enabled = true
# (live) A hotkey name, e.g. "F8" or "Ctrl+V"; "" unbinds it.
key = "F8"
# (live) Spoken on each press: "en", "pl" or "" for silence.
announce = "en"

[invasion_path]
# A trail of Prism Stones along a walkable route to every other player more than 30 m away.
enabled = false
# Toggle key.
toggle_key = "semicolon"
marker_effect_id = 833  # (live) 833-839 are the stone's seven colours, 0 = none

[invadable_hosts]
# A panel counting the Seamless Co-op hosts you could invade now, per invasion bracket, and how
# many new ones open each minute. Needs [seamless]. Nothing is joined or published to count them,
# and Steam is asked only after you first open the panel. The per-minute average is kept in
# ds2-invadable-hosts.txt beside this file; delete it to start over.
enabled = true
key = "F4"       # (live) opens and closes the panel; Esc also closes it
view_key = "R"   # (live) while it is open: hosts now <-> new hosts per minute

# ============================================================================================
# Pause menu and saves
# ============================================================================================

[menu_row]
# Extra pause-menu rows, in this order. Keep the list on one line: the reader is line-based.
#   load-build-from-url       apply a soulsplanner build to this character (raises soul memory)
#   load-character-from-file  pick a save for the next launch to load
#   save-game-to-file         save, then copy the save file where you choose
#   build-recommender         the PvP build recommender panel (Apply raises soul memory)
#   quit-to-desktop           quit at once, no confirmation and no save
# All of them:
#   rows = ["load-build-from-url", "load-character-from-file", "save-game-to-file", "build-recommender", "quit-to-desktop"]
rows = []

[save_block]
# Refuse the game's own saves (autosave, bonfire, quit), so save-game-to-file is the only save and
# anything after your last press of it is lost. Ignored unless that row is in [menu_row] rows.
enabled = false

# ============================================================================================
# Gameplay and HUD
# ============================================================================================

[estus_max]
enabled = true  # Estus Flask at max charges and heal (12 and +6) on every load

[item_warn]
enabled = true  # red X on items your stats or attunement slots can't use

[inventory_sort]
up_enters_list = true  # UP on the inventory category strip enters the item list

[continue]
hollow_slot_guard = true  # stop a hollow save slot from hanging the game on load

[change_appearance]
enabled = false  # bonfire row: the character creator, changing only face, sex and body

[rename_character]
enabled = false  # bonfire row: rename the character

[reallocate_stats]
enabled = false  # bonfire row: the Soul Vessel reallocate screen, greyed until it can be used
