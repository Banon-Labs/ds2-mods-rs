# hudhook 0.9.2 (https://github.com/veeenu/hudhook, MIT, `LICENSE`), vendored with three changes:
#
# 1. `hooks::dx11::{set_shared_render_loop, render_shared}`: render through a `Present` detour
#    that somebody else owns. `ds2-invasion-path` already detours `IDXGISwapChain::Present`, and
#    MinHook refuses a second hook on the same address (`MH_ERROR_ALREADY_CREATED`), which
#    upstream's `ImguiDx11Hooks::new` answers with a panic.
# 2. No `build.rs`. Upstream compiles its own copy of MinHook; this workspace already links one
#    through `ds2-hook`, and two copies of the same C symbols would leave which one wins to link
#    order. The `mh` module's `extern` declarations resolve to `ds2-hook`'s copy.
# 3. Only the DirectX 11 backend: DARK SOULS II: SOTFS is DX11. The dx9, dx12, OpenGL and
#    injector sources are deleted; their `cfg(feature = ...)` lines are left as upstream wrote
#    them and name features this manifest does not declare.
[package]
name = "hudhook"
version = "0.9.2"
edition = "2021"
license-file = "LICENSE"
publish = false

[features]
default = ["dx11"]
dx11 = []

[dependencies]
bitflags = "2.5.0"
imgui = "0.12"
once_cell = { version = "1.18.0", default-features = false }
parking_lot = "0.12"
tracing = { version = "0.1", features = ["log"], default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"], default-features = false }
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  # `util.rs` still carries upstream's D3D12 helpers; kept rather than edited out.
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
]

# Upstream's `cfg(feature = "dx9" | "dx12" | "opengl3" | "inject")` lines stay as written; their
# sources are deleted, so those features are not declared, and this tells rustc the names are known.
[lints.rust]
# `wait_idle` is only called by the deleted dx12 backend.
dead_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dx9", "dx12", "opengl3", "inject"))'] }
